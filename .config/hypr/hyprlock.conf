# Minimal lock screen. `screenshot` captures the currently displayed wallpaper.
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    brightness = 0.75
}

general {
    grace = 0
    disable_loading_bar = false
}

# Generated by Matugen from ~/.config/matugen/templates/hyprlock.conf.
source = ~/.config/hypr/colors.conf

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lock_primary
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 115
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $lock_primary
    inner_color = rgba(19, 19, 24, 0.75)
    font_color = $lock_primary
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Password</i>
    position = 0, -35
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$(hyprctl splash)"
    color = $lock_accent
    font_size = 12
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 30
    halign = center
    valign = bottom
}
